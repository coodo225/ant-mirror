name: 시장 데이터 수집

# 한국 증시 09:00~15:30 KST = 00:00~06:30 UTC
# GitHub Actions 의 cron 은 UTC 기준이며, 실제 실행은 수 분 지연될 수 있습니다.
on:
  schedule:
    - cron: '*/10 0-6 * * 1-5'   # 장중 10분마다 (KST 09:00~15:59, 평일)
    - cron: '40 6 * * 1-5'       # KST 15:40 — 장 마감 직후
    - cron: '0 9 * * 1-5'        # KST 18:00 — 수급 확정치 반영
    - cron: '30 22 * * 0-4'      # KST 07:30 — 간밤 미국장 마감 반영
  workflow_dispatch:             # 수동 실행 버튼

permissions:
  contents: write

# 앞 실행이 끝나기 전에 다음 실행이 겹쳐 push 충돌 나는 것을 막는다
concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: 의존성 설치
        run: pip install -r collector/requirements.txt

      - name: 한글 폰트 설치 (OG 공유 카드용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      - name: 데이터 수집
        env:
          # 선택사항. 없으면 미국 CPI/고용/PCE 일정과 매크로 실측치만 빠집니다.
          # 무료 발급: https://fred.stlouisfed.org/docs/api/api_key.html
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python collector/collect.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/og.png
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          # 다른 실행이 먼저 push 했을 수 있으므로 rebase 후 재시도
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push 재시도 $i"
            sleep 5
          done
          exit 1
