name: 시장 데이터 수집

# GitHub Actions 의 cron 은 UTC 기준이고, 부하가 몰리면 실행이 늦어지거나 아예 빠진다(실측: 장중 30분 간격 중 하루 2번꼴).
# 그래서 장중엔 외부 스케줄러(cron-job.org 등)가 workflow_dispatch 로 5분마다 깨우고(README '장중 5분 갱신'),
# 아래 cron 은 보험으로 둔다. 어떤 트리거로 깨든 '수집 방식 정하기' 단계가 전체 / 장중 가벼운 수집 / 건너뛰기를 고른다.
on:
  schedule:
    - cron: '7,37 0-6 * * 1-5'   # KST 09:07~15:37, 30분마다 (장중 잠정치)
    - cron: '17 9 * * 1-5'       # KST 18:17 — 장 마감 후
    - cron: '23 11 * * 1-5'      # KST 20:23 — 투자자별 수급 확정치 (KRX 값은 20시 전후까지 바뀐다)
    - cron: '37 22 * * 0-4'      # KST 07:37 — 간밤 미국장 마감 반영
  workflow_dispatch:             # 외부 스케줄러(5분마다) · 수동 실행 버튼
    inputs:
      force:
        description: '시간대와 상관없이 전체 수집'
        type: boolean
        default: false

# 수집 결과는 main 에 커밋하지 않는다. 최신 데이터 한 벌만 data 브랜치에 덮어쓰고(이력이 쌓이지 않게),
# 사이트는 main 의 화면 코드 + 이번 데이터를 묶어 GitHub Actions 로 Pages 에 배포한다.
permissions:
  contents: write     # data 브랜치에 올리기
  pages: write        # Pages 배포
  id-token: write     # Pages 배포 인증
  actions: write      # 예약 실행 유지(맨 아래 단계)

# 앞 실행이 끝나기 전에 다음 실행이 겹치지 않게 한다
concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    # ubuntu-latest 는 2026-10-19 부터 26.04 로 바뀐다. 새 이미지용 파이썬 빌드가 늦게 나올 수 있어 버전을 고정한다
    runs-on: ubuntu-24.04
    timeout-minutes: 25          # 350종목 이력을 처음 채우는 실행이 몇 분 더 걸린다
    outputs:
      code: ${{ steps.collect.outputs.code }}
      uploaded: ${{ steps.upload.outcome == 'success' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      # 수집기는 소스가 실패하면 직전 정상본(docs/data)을 유지한다 — 그 직전본을 data 브랜치에서 받는다
      - name: 직전 데이터 받기 (data 브랜치)
        run: |
          if git fetch -q --depth=1 origin data; then
            git archive FETCH_HEAD docs | tar -x
            echo "data 브랜치에서 직전 데이터를 받았습니다"
          else
            echo "::warning::data 브랜치가 없어 직전 데이터 없이 시작합니다"
          fi

      # 하루 종일 5분마다 깨워도 되게, 깨어날 때마다 할 일을 고른다(collector/mode.py — 장중 가벼운 수집,
      # 장 전·마감 뒤·20시 확정 전체 수집, 밤·중복은 건너뜀). 수동 실행에서 force 를 켜면 늘 전체 수집.
      - name: 수집 방식 정하기
        id: mode
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: python3 collector/mode.py >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: steps.mode.outputs.mode != 'skip'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: 의존성 설치
        if: steps.mode.outputs.mode != 'skip'
        run: pip install -r collector/requirements.txt

      # 350종목 일별 투자자 이력(2018-08~). 공개 data 브랜치에 올리지 않고 캐시에만 둔다. 바뀐 실행만 새로 저장한다.
      - name: 종목 이력 캐시 받기
        if: steps.mode.outputs.mode == 'full'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/stockhist.json.gz
          key: stockhist-v1-${{ github.run_id }}
          restore-keys: stockhist-v1-

      - name: 한글 폰트 캐시 (OG 공유 카드용)
        id: font-cache
        if: steps.mode.outputs.mode == 'full'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/og-fonts
          key: og-fonts-nanumgothic-v1

      # 공유 카드용이라 실패해도 데이터 수집은 계속한다.
      # (예전엔 매번 apt-get 으로 설치했는데, 미러가 멈추면 15분 타임아웃으로 수집까지 취소됐다)
      - name: 한글 폰트 받기
        if: steps.mode.outputs.mode == 'full' && steps.font-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 3
        run: |
          tmp="$(mktemp -d)"
          for f in NanumGothic-Regular NanumGothic-Bold; do
            curl -fsSL --retry 2 -o "$tmp/$f.ttf" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/nanumgothic/$f.ttf"
          done
          # 둘 다 받았을 때만 캐시 경로로 옮긴다 — 반쪽짜리가 캐시에 남지 않게
          mkdir -p ~/.cache && mv "$tmp" ~/.cache/og-fonts

      - name: 데이터 수집
        id: collect
        if: steps.mode.outputs.mode != 'skip'
        timeout-minutes: 20        # 잡 전체 시간 초과로 취소되면 아래 '실패한 시도 기록'이 못 돈다 — 단계에서 먼저 끊는다
        env:
          # 선택사항. 없으면 미국 CPI/고용/PCE 일정과 매크로 실측치만 빠집니다.
          # 무료 발급: https://fred.stlouisfed.org/docs/api/api_key.html
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 선택사항. 둘 다 있으면 매일 확정 요약(20시 이후 수집분)을 텔레그램으로 한 번 보냅니다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # exit 3 = 핵심 데이터(코스피 수급·일봉)가 갱신되지 않아 직전 정상본을 유지함.
        # 나머지 데이터는 올리고 배포해야 하므로 여기서는 멈추지 않고, 마지막 단계에서 실패로 표시한다.
        run: |
          set +e
          if [ "${{ steps.mode.outputs.mode }}" = "intraday" ]; then
            python collector/collect.py --intraday
          else
            OG_FONT_DIR="$HOME/.cache/og-fonts" python collector/collect.py
          fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: 종목 이력 캐시 저장
        if: ${{ !cancelled() && steps.mode.outputs.mode == 'full' && hashFiles('.cache/stockhist.json.gz.changed') != '' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/stockhist.json.gz
          key: stockhist-v1-${{ github.run_id }}

      # data 브랜치에는 부모 없는 커밋 하나만 둔다(덮어쓰기). 저장소가 데이터 이력으로 불어나지 않는다.
      # 동시 실행은 concurrency 가 막고, 데이터는 매 실행 통째로 다시 만들므로 덮어써도 잃는 것이 없다.
      - name: 데이터 브랜치에 올리기
        if: steps.mode.outputs.mode != 'skip'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/data-index"
          rm -f "$GIT_INDEX_FILE"
          git add -f docs/data
          if [ -f docs/og.png ]; then git add -f docs/og.png; fi
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -m "데이터 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')")"
          for i in 1 2 3; do
            if git push -q -f origin "$commit:refs/heads/data"; then exit 0; fi
            echo "push 재시도 $i"
            sleep $((i * 5))
          done
          exit 1

      # 실패한 실행은 데이터를 올리지 않아 meta.json 의 수집 시각이 그대로다. 그대로 두면 5분마다 깨울 때마다
      # 무거운 전체 수집을 다시 시도하므로, data 브랜치의 meta.json 에 '실패한 시도'와 쓴 요청 수만 적어 둔다.
      - name: 실패한 시도 기록
        if: ${{ !cancelled() && failure() && steps.mode.outputs.mode != 'skip' }}
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth=1 origin data || exit 0
          git show FETCH_HEAD:docs/data/meta.json > "$RUNNER_TEMP/meta.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/meta.json"
          python3 collector/mode.py --record-failure "$RUNNER_TEMP/meta.json" "${{ steps.mode.outputs.mode }}"
          export GIT_INDEX_FILE="$RUNNER_TEMP/fail-index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree FETCH_HEAD
          blob="$(git hash-object -w "$RUNNER_TEMP/meta.json")"
          git update-index --add --cacheinfo "100644,$blob,docs/data/meta.json"
          tree="$(git write-tree)"
          commit="$(git commit-tree "$tree" -m "실패한 수집 시도 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')")"
          git push -q -f origin "$commit:refs/heads/data"

      # 수집하는 동안 화면 코드가 바뀌었을 수 있다 — 배포 직전에 main 의 최신 화면 코드로 맞춘다(데이터는 그대로)
      - name: 최신 화면 코드로 맞추기
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          git fetch -q --depth=1 origin "${{ github.ref_name }}"
          git checkout FETCH_HEAD -- docs ':(exclude)docs/data' ':(exclude)docs/og.png'

      - name: 사이트 묶기
        id: upload
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs

      # 60일 동안 저장소 활동이 없으면 GitHub 가 예약 실행을 끈다. 이제 봇이 main 에 커밋하지 않으므로 직접 켜 둔다
      - name: 예약 실행 유지
        if: ${{ !cancelled() && steps.mode.outputs.mode == 'full' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/collect.yml/enable"

      - name: 핵심 데이터 갱신 실패 알림
        if: steps.collect.outputs.code == '3'
        run: |
          echo "::error::핵심 데이터(코스피 수급 또는 일봉)가 갱신되지 않았습니다. 화면은 직전 정상본을 보여 주는 중입니다 (meta.json 의 stale/warnings 참고)."
          exit 1

  # 수집이 exit 3 으로 끝나도(직전 정상본 + 새 비핵심 데이터) 묶은 사이트는 배포한다
  deploy:
    needs: collect
    if: ${{ !cancelled() && needs.collect.outputs.uploaded == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
